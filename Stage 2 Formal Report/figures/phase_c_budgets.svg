   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253746" x="121.18392" y="19.178764" transform="rotate(-0 121.18392 19.178764)">B = min(3300 ms, 0.45 L); 1800 ms without a positive limit</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253746" x="141.36408" y="46.279334" transform="rotate(-0 141.36408 46.279334)">Fallback and BDD portfolio (through B/2)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253746" x="388.57104" y="46.279334" transform="rotate(-0 388.57104 46.279334)">J51 through B, when supported</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253746" x="15.23808" y="62.192333" transform="rotate(-0 15.23808 62.192333)">Split when the typed-cost guard passes. BDD can use the full main window otherwise.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253746" x="15.23808" y="80.633549" transform="rotate(-0 15.23808 80.633549)">BDD remainder: screening ≤ 35% of time left at entry; probes share ⅔ of the next remainder.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253746" x="15.23808" y="97.310822" transform="rotate(-0 15.23808 97.310822)">Rank measured orders, then refine within the BDD deadline.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253746" x="15.23808" y="118.478131" transform="rotate(-0 15.23808 118.478131)">Later steps</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253746" x="121.18392" y="120.685631" transform="rotate(-0 121.18392 120.685631)">Elapsed-time admission guards for positive input limit L</text>
   </g>
